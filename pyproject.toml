[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-learning-series"
version = "0.1.0"
description = "Learning-focused AI agent components: intent, routing, and memory."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["agent_learning_series*"]
exclude = ["tests*"]
